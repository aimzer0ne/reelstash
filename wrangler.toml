# Website and API for https://reelsdl.net (route: reelsdl.net/* and www.reelsdl.net/*).
# Cloudflare serves the prerendered site from dist (`npm run build`); worker.js runs /api/*.
# Secret: DOWNLOAD_TOKEN_SECRET (`npx wrangler secret put DOWNLOAD_TOKEN_SECRET`).
name = "reelstash"
main = "worker.js"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]
# Only the custom domain serves the site: no *.workers.dev address and no per-version preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# /about/ → redirect to /about, served from about/index.html
html_handling = "drop-trailing-slash"
# Unknown URLs get the nearest 404.html with a 404 status
not_found_handling = "404-page"
# Pages and the API go through worker.js; fingerprinted files and images skip it.
run_worker_first = ["/*", "!/_astro/*", "!/assets/*"]
